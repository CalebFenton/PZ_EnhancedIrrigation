# shellcheck shell=bash
# What the shared test harness in dev/harness needs to know about this mod; its scripts source
# this. dev/harness/docs/adopting.md describes every key and hook. Paths are relative to the
# repository.

MOD_DIR=Contents/mods/EnhancedIrrigation
DEV_MOD_DIR=dev/EnhancedIrrigationDevHarness
# The shared code the mod's mod.info requires, from its own repository checked out beside this
# one: every run and check loads it before the mod, as a player's game does.
LIBRARY_MODS=(../cf_commonlib/Contents/mods/cf_commonlib)
# Cache dirs under $TMPDIR: <name>-client, <name>-server, <name>-mpclient, <name>-mpserver and
# <name>-check.
CACHE_NAME=pz-irrigation
TAG=EnhancedIrrigationTest
# What every game run of the harness checks first: a game started on Lua that doesn't compile, or
# on a script or translation the game rejects, costs a game start to learn what this finds in
# seconds.
PRECHECK=(dev/static-check.sh)
# What a kept --test --stay game loads again for a rerun, relative to the dev mod; with --mp the
# server loads the server files again too.
RELOAD_FILES=('42/media/lua/client/EnhancedIrrigation/Debug/EnhancedIrrigationTest*.lua'
    '42/media/lua/server/EnhancedIrrigation/Debug/EnhancedIrrigationTest*.lua')
# The tests that --changed runs for each changed file: those that reach its code, through the
# fixtures and server handlers too; every glob a file matches adds its prefixes. A test file names
# its own tests, and a handler file the tests of every file that calls it. What every system
# touches names the whole prefix irrigation_, which runs every test: the foundation modules under
# shared/EnhancedIrrigation, the object system, the tiles, the translations, the sandbox options,
# the mod.info files, the dev mod's client and server test libraries and settings, the debug
# scenarios' file, as every test runs in its scenario, and the harness modules every test goes
# through. An empty list marks a file no test exercises: the art pipeline's outputs (icons, the
# poster and the depth map with the tileGeometry.txt that loads it), the QA scenario's setup and
# the staging it shares with the --art and --promo modes, and those modes, which only the eye
# checks. dev/static-check.sh fails on a file with no entry and on a glob that matches no file.
