# --art stages the tiles on an open lot and saves screenshots of them (EnhancedIrrigationDevArt.lua).
# --promo stages the mod in use and shoots the raw art of the Workshop page, the README's images
# and the gallery into art/promo/captures (EnhancedIrrigationDevPromo.lua); PROMO=<group>,...
# shoots only those groups.
MODES='art promo'
MODE_MARK_art=EIArt
MODE_MARK_promo=EIPromo
MODE_SELECTION_promo=PROMO
MODE_GROUPS_promo='icons world water menu poster'
MODE_CAPTURES_promo=art/promo/captures

# Script and tile warnings name the item, recipe or tileset, and cf_commonlib's Loot.place prints
# "EnhancedIrrigation: missing loot list" for an unknown loot list. A debug server logs every build-menu
# entity's name as a missing translation and its icon as not found, vanilla's too, since it loads
# no textures (../RenewableEnergy/DEVELOPMENT.md, Translations); the raised barrels borrow
# vanilla's barrel icons.
SERVER_PROBLEMS='EnhancedIrrigation: missing loot list|^(WARN|ERROR).*([Ii]rrigation|enhanced_irrigation)'
SERVER_IGNORE='Missing translation "EnhancedIrrigation_(TankStand|BarrelFilter|BrickFilter|FilterCrock|BoilerStone|BoilerWelded|WoodenHandPump|IronHandPump|PumpHouseWood|PumpHouseMetal)"|Could not find icon: (EnhancedIrrigation_Build_|Build_RainCollectorBarrel)'

# The Workshop page: README.md becomes workshop.txt's description (dev/workshop-txt.sh), its images
# and links loaded from this repository.
WORKSHOP_REPO=CalebFenton/PZ_EnhancedIrrigation
WORKSHOP_SKIP=()
