# shellcheck shell=bash
# What the shared test harness in dev/harness needs to know about this mod; its scripts source
# this. dev/harness/docs/adopting.md describes every key and hook. Paths are relative to the
# repository.

MOD_DIR=Contents/mods/EnhancedIrrigation
DEV_MOD_DIR=dev/EnhancedIrrigationDevHarness
# Cache dirs under $TMPDIR: <name>-client, <name>-server, <name>-mpclient, <name>-mpserver and
# <name>-check.
CACHE_NAME=pz-irrigation
TAG=EnhancedIrrigationTest
# What every game run of the harness checks first: a game started on Lua that doesn't compile, or
# on a script or translation the game rejects, costs a game start to learn what this finds in
# seconds.
PRECHECK=(dev/static-check.sh)
# What a kept --test --stay game loads again for a rerun, relative to the dev mod; with --mp the
# server loads the server files again too.
RELOAD_FILES=('42/media/lua/shared/EnhancedIrrigation/Debug/EnhancedIrrigationProbe.lua'
    '42/media/lua/client/EnhancedIrrigation/Debug/EnhancedIrrigationTest*.lua'
    '42/media/lua/server/EnhancedIrrigation/Debug/EnhancedIrrigationTest*.lua')
# The tests that --changed runs for each changed file: those that reach its code, through the
# fixtures and server handlers too. A file with no entry runs every test; that is left to what
# both features touch (the foundation modules under shared/EnhancedIrrigation, the object system,
# the tiles, the translations and the dev mod's test library and settings). An empty
# list marks a file no test exercises: the art pipeline's outputs, and the --art mode that shows
# them, which only the eye checks.
TEST_MAP=('dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigationProbe.lua=irrigation_probe_'
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigationTestsProbe.lua=irrigation_probe_'
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigationTestServerProbe.lua=irrigation_probe_'
    'Contents/*/EnhancedIrrigation/Lines.lua=irrigation_lines_'
    'Contents/*/EnhancedIrrigation/LineJobs.lua=irrigation_lines_'
    'Contents/*/EnhancedIrrigationWaterAction.lua=irrigation_lines_'
    'Contents/*/EnhancedIrrigation/Lines/*.lua=irrigation_lines_'
    'Contents/*/UI/LineMenu.lua=irrigation_lines_'
    'Contents/*/UI/PlantInfo.lua=irrigation_lines_plant_info_'
    'Contents/*/BuildingObjects/LineCursor.lua=irrigation_lines_'
    'Contents/*/EnhancedIrrigation/Stands.lua=irrigation_tanks_,irrigation_lines_'
    'Contents/*/EnhancedIrrigation/StandJobs.lua=irrigation_tanks_'
    'Contents/*/Stands/StandSystem.lua=irrigation_tanks_'
    'Contents/*/EnhancedIrrigation/Links.lua=irrigation_tanks_'
    'Contents/*/EnhancedIrrigation/LinkJobs.lua=irrigation_tanks_'
    'Contents/*/Links/*.lua=irrigation_tanks_'
    'Contents/*/UI/TankMenu.lua=irrigation_tanks_'
    'Contents/*/EnhancedIrrigation/Recipes.lua=irrigation_tanks_,irrigation_learning_'
    'Contents/*/server/EnhancedIrrigation/Items/Distributions.lua=irrigation_loot_'
    'Contents/*/scripts/EnhancedIrrigation/Items.txt=irrigation_learning_,irrigation_loot_'
    'Contents/*/scripts/EnhancedIrrigation/Entities.txt=irrigation_tanks_,irrigation_lines_water_from_a_raised_tank,irrigation_learning_'
    'Contents/*/scripts/EnhancedIrrigation/Recipes.txt=irrigation_tanks_,irrigation_learning_'
    'art/*='
    'tools/*='
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigationTestServer.lua=irrigation_lines_,irrigation_tanks_,irrigation_learning_'
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigation*Tanks.lua=irrigation_tanks_'
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigation*Lines.lua=irrigation_lines_'
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigation*Learning.lua=irrigation_learning_,irrigation_loot_'
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigationDevArt.lua='
    'dev/EnhancedIrrigationDevHarness/*/EnhancedIrrigationDevStage.lua=')

# --art stages the tiles on an open lot and saves screenshots of them (EnhancedIrrigationDevArt.lua).
MODES='art'
MODE_MARK_art=EIArt

# Script and tile warnings name the item, recipe or tileset, and Distributions.lua prints
# "EnhancedIrrigation: no loot list" for an unknown loot list. A debug server logs every build-menu
# entity's name as a missing translation and its icon as not found, vanilla's too, since it loads
# no textures (../RenewableEnergy/DEVELOPMENT.md, Translations); the raised barrels borrow
# vanilla's barrel icons.
SERVER_PROBLEMS='EnhancedIrrigation: no loot list|^(WARN|ERROR).*([Ii]rrigation|enhanced_irrigation)'
SERVER_IGNORE='Missing translation "EnhancedIrrigation_TankStand"|Could not find icon: (EnhancedIrrigation_Build_|Build_RainCollectorBarrel)'
